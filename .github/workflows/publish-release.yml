name: Validate and publish GMT research release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run automated tests
        run: python -m unittest discover -s simulation -p "test_*.py" -v
      - name: Run reproducible simulations
        run: python simulation/run_experiments.py
      - name: Build proof-and-simulation PDF
        run: python scripts/build_pdf.py
      - name: Publish or update GitHub Release and attach PDF
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            gh release upload v0.1.0 release/GMT_Proofs_and_Simulations.pdf --clobber
          else
            gh release create v0.1.0 release/GMT_Proofs_and_Simulations.pdf \
              --title "GMT Proofs and Simulations v0.1.0" \
              --notes-file release/RELEASE_NOTES_v0.1.0.md
          fi
